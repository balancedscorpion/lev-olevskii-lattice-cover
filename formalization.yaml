version: v0.4
project:
  name: Finite modulated lattice-comb decompositions for crystalline measures
  description: >
    In every positive dimension, a crystalline measure with uniformly discrete support
    and uniformly discrete spectrum is a finite complex linear combination of translated,
    modulated combs on full-rank lattices. The support and spectrum each lie in finitely
    many lattice translates. The lattices can differ between terms, and the nonzero atomic
    weights can approach zero. This gives the physical-support covering conclusion in the
    question of Lev and Olevskii.
  authors: [Jamie Martin]
  responsible_maintainers: [Jamie Martin]
  license: MIT
classification:
  arxiv: [math.CA, math.FA]
  msc2020: [42B10, 46F12]
sources:
  - title: Half-line density and the structure of crystalline measures
    authors: [Jamie Martin]
    type: paper
    id: https://hexagonmath.org/2611.00744v2
    relationship: formalizes
    note: Theorem A.1 and both covering conclusions proved on pages 12–13.
  - title: Fourier quasicrystals and discreteness of the diffraction spectrum
    authors: [Nir Lev, Alexander Olevskii]
    type: paper
    id: arXiv:1512.08735v2
    relationship: background
    note: Section 11.2, question (1), asks about a finite lattice cover of the physical support.
  - title: A characterization of uniformly discrete crystalline measures with unit weights
    authors: [Lior Alon, Mario Kummer]
    type: paper
    id: arXiv:2611.24286v1
    relationship: adapts
    note: Sections 3 and 4 motivate the finite-generation and restricted-character rank arguments.
  - title: Équations diophantiennes exponentielles
    authors: [Michel Laurent]
    type: paper
    relationship: background
    note: The argument proves the unitary torus coset theorem needed in Appendix A.
  - title: Heights in Diophantine Geometry
    authors: [Enrico Bombieri, Walter Gubler]
    type: book
    relationship: background
    note: The fixed-number-field unit-equation corollary 7.4.3 enters through the Subspace-Theorems dependency.
