fidelity:
  divergences: >
    A crystalline measure is represented by its tempered distribution and local atomic
    expansions on compactly supported Schwartz tests. All named sites have nonzero weights.
    The conclusion includes both lattice covers from the paper’s proof. An empty comb sum
    represents zero. For the geometric dimension estimate the proof bounds characters
    directly on each spanning coset. The required torus coset theorem follows from
    number-field specialization and induction. Weight recovery uses lattice averages,
    inclusion–exclusion and packing estimates on dual orbits.
